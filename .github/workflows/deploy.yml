name: Deploy site

# The site is plain HTML/CSS in site/. Pushing to main publishes site/ to the
# gh-pages branch, which GitHub Pages serves at shayankhodabakhsh.com.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Only the newest run may publish, so an older, slower run can never overwrite
# a newer deploy.
concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy site/ to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
