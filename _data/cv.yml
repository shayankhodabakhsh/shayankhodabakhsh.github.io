    Experience:
      - company: Dept. of Electrical, Computer, and Biomedical Engineering, URI
        position: Graduate Researcher (Profs. Abiri and Walls) — Vision-Language Models for Eating Microstructure and Feedback (NIH-funded, DIBS)
        location: Kingston, RI
        start_date: 2026-01
        end_date: Present
        highlights:
          - Developed a video-based bite measurement pipeline using the Qwen2.5-VL visual encoder, LoRA adaptation, and post-encoder temporal attention with past-only, 4-second windows.
          - Evaluated 29 participant-held-out laboratory meals with model selection restricted to inner-validation participants; mean bite-event F1 0.887, onset MAE 382 ms, and 60-second bite-rate MAE 0.43 bites/min (1.63 for a no-video baseline).
          - Compared temporal ablations and alternative visual encoders; assessed how missed, additional, and delayed detections affect eating-rate estimates and feedback decisions through error injection, recorded-meal replay, and closed-loop simulation.
          - First-author manuscript submitted to IEEE JBHI; prospective intervention evaluation remains future work.

      - company: Dept. of Electrical, Computer, and Biomedical Engineering, URI
        position: Graduate Researcher (Prof. Besio) — Tripolar Concentric Ring Electrode (TCRE) EEG Comparison
        location: Kingston, RI
        start_date: 2026-01
        end_date: Present
        highlights:
          - Built a unified Python preprocessing and analysis pipeline to compare Paste, Gel, and saline-soaked Felt TCRE configurations on resting-state and visual-evoked-potential recordings.
          - Used scale-invariant cross-setup metrics (alpha SNR, alpha reactivity, spectrogram SSIM) to handle hardware scaling differences across acquisitions.
          - Ran preprocessing sensitivity analyses and per-subject VEP diagnostics that informed cohort and exclusion decisions for the manuscript (in preparation, Sensors MDPI).

      - company: Dept. of Electrical, Computer, and Biomedical Engineering, URI
        position: Graduate Researcher (Prof. Abiri) — PRIME Closed-Loop Cobot
        location: Kingston, RI
        start_date: 2026-01
        end_date: 2026-05
        highlights:
          - Fine-tuned YOLO-based perception on task-specific images for the closed-loop perception module of a human-robot teaming cobot.
          - Integrated the perception module with the cobot stack and ran end-to-end task evaluation experiments.
          - Manuscript under review.

      - company: Dept. of Electrical, Computer, and Biomedical Engineering, URI
        position: Graduate Researcher — Automated Neuromuscular Assessment with Computer Vision and Robotics
        location: Kingston, RI
        start_date: 2025-09
        end_date: Present
        highlights:
          - Developing a non-invasive assessment system using Socially Assistive Robots (SAR) to automate standardized neuromuscular tests.
          - Implementing computer vision pipelines (Python/OpenCV) for 3D hand pose estimation to quantify fine motor deficits without markers.
          - Designing closed-loop algorithms to provide real-time feedback to patients during unsupervised rehabilitation sessions.

      - company: Dept. of Electrical, Computer, and Biomedical Engineering, URI
        position: Graduate Researcher — Multimodal EEG and Motion Capture for Movement Decoding
        location: Kingston, RI
        start_date: 2025-09
        end_date: Present
        highlights:
          - Engineered a hardware synchronization solution to fuse high-density EEG (g.tec) data with optical motion capture systems.
          - Optimizing data acquisition protocols to reduce latency between cortical activity and recorded kinematic events.
          - Analyzing neural correlates of grasping and reaching movements for potential Brain-Computer Interface applications.

      - company: Biomechanics and Wearable Sensors Lab, URI
        position: Research Assistant (Prof. Chapman) — Wearable Inertial Sensor Validation
        location: Kingston, RI
        start_date: 2023-06
        end_date: 2023-09
        highlights:
          - Validated commercial IMU sensor accuracy against gold-standard optical motion capture.
          - Analyzed sensor drift and calibration errors in measuring sagittal knee angles during dynamic tasks.

